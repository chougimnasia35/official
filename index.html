<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЧОУ «Гимназия №35» — скоро открытие</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --mint: #7fc8a9;
    --mint-soft: #a8ddc4;
    --mint-deep: #4fa985;
    --mint-dark: #2f7d5f;
    --air: rgba(255, 255, 255, 0.55);
  }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    overflow: hidden;
    position: relative;
    padding: 24px;
    /* Нежный мятно-зелёный градиент */
    background: linear-gradient(135deg,
      #eafaf1 0%,
      #d4f0e2 35%,
      #b9e6d3 65%,
      #eafaf1 100%);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ===== ЭФФЕКТ ВОЗДУХА: мягкие светящиеся пятна ===== */
  .air {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
    will-change: transform;
  }

  .air--1 {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
    top: -140px; left: -120px;
    animation: drift1 22s ease-in-out infinite;
  }

  .air--2 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, var(--mint-soft) 0%, rgba(168,221,196,0) 70%);
    bottom: -180px; right: -140px;
    animation: drift2 26s ease-in-out infinite;
  }

  .air--3 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
    top: 40%; left: 55%;
    opacity: 0.35;
    animation: drift3 30s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(60px, 40px) scale(1.12); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-70px, -50px) scale(1.1); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
    50%      { transform: translate(-40px, 30px) scale(1.08); opacity: 0.45; }
  }

  /* ===== Стеклянная карточка ===== */
  .cover {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 700px;
    width: 100%;
    padding: 64px 52px 56px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
      0 24px 70px rgba(47, 125, 95, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation: cardIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    will-change: transform, opacity;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Плавное парение всей карточки */
  .cover::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
  }
  .cover {
    animation:
      cardIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) both,
      breathe 9s ease-in-out 1.4s infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  /* ===== Тексты ===== */
  .subtitle {
    font-size: 1.1rem;
    color: var(--mint-dark);
    letter-spacing: 0.6px;
    font-weight: 400;
    opacity: 0;
    animation: fadeUp 1.2s ease 0.5s forwards;
  }

  .divider {
    width: 72px;
    height: 3px;
    margin: 26px auto 30px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--mint), transparent);
    opacity: 0;
    animation: fadeUp 1.2s ease 0.8s forwards;
  }

  .school-name {
    font-size: clamp(1.7rem, 4.8vw, 3rem);
    font-weight: 700;
    color: var(--mint-dark);
    line-height: 1.25;
    margin-bottom: 42px;
    letter-spacing: 0.5px;
  }

  /* ===== Плавная анимация букв ===== */
  .school-name .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    animation: letterIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform, opacity, filter;
  }

  .school-name .space {
    display: inline-block;
    width: 0.3em;
  }

  @keyframes letterIn {
    0% {
      opacity: 0;
      transform: translateY(14px);
      filter: blur(6px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Кнопка ===== */
  .btn-vk {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 34px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(135deg, var(--mint) 0%, var(--mint-deep) 100%);
    box-shadow:
      0 10px 26px rgba(79, 169, 133, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition:
      transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1),
      background 0.6s ease;
    opacity: 0;
    animation: fadeUp 1.4s ease 2.4s forwards;
    will-change: transform;
  }

  .btn-vk:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow:
      0 16px 36px rgba(79, 169, 133, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.45);
    background: linear-gradient(135deg, var(--mint-deep) 0%, var(--mint-dark) 100%);
  }

  .btn-vk:active {
    transform: translateY(-1px) scale(1);
    transition-duration: 0.15s;
  }

  .btn-vk svg {
    width: 22px;
    height: 22px;
    fill: #fff;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-vk:hover svg {
    transform: rotate(-6deg) scale(1.08);
  }

  @media (max-width: 480px) {
    .cover { padding: 44px 26px; border-radius: 24px; }
    .btn-vk { padding: 14px 26px; font-size: 0.98rem; }
  }

  /* Уважение к настройкам пользователя */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- Воздушные светящиеся пятна -->
  <div class="air air--1"></div>
  <div class="air air--2"></div>
  <div class="air air--3"></div>

  <div class="cover">
    <p class="subtitle">Здесь скоро появится официальный сайт школы</p>
    <div class="divider"></div>
    <h1 class="school-name" id="schoolName">ЧОУ «Гимназия №35»</h1>
    <a class="btn-vk" href="https://vk.ru/ruzavinevgeniy" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.162 18.994c.609 0 .858-.406.851-.915-.031-1.917.714-2.949 2.059-1.604 1.488 1.488 1.796 2.519 3.603 2.519h3.2c.808 0 1.126-.26 1.126-.668 0-.863-1.421-2.386-2.625-3.504-1.686-1.565-1.765-1.602-.313-3.486 1.801-2.339 4.157-5.336 2.073-5.336h-3.981c-.772 0-.828.435-1.103 1.083-.995 2.347-2.886 5.387-3.604 4.922-.751-.485-.407-2.406-.35-5.261.015-.754.011-1.271-1.141-1.539-.629-.145-1.241-.205-1.809-.205-2.273 0-3.841.953-2.95 1.119 1.571.293 1.42 3.692 1.054 5.16-.638 2.556-3.036-2.024-4.035-4.305-.241-.548-.315-.974-1.175-.974h-3.255c-.492 0-.787.16-.787.516 0 .602 2.96 6.72 5.786 9.77 2.756 2.975 5.575 2.389 7.494 2.389z"/>
      </svg>
      Написать директору в ВК
    </a>
  </div>

<script>
  const el = document.getElementById('schoolName');
  const text = el.textContent;
  el.textContent = '';

  [...text].forEach((char, i) => {
    const span = document.createElement('span');
    if (char === ' ') {
      span.className = 'space';
      span.textContent = '\u00A0';
    } else {
      span.className = 'letter';
      span.textContent = char;
      // Плавный «воздушный» разлёт появления
      span.style.animationDelay = (0.9 + i * 0.045) + 's';
    }
    el.appendChild(span);
  });
</script>
</body>
</html>
