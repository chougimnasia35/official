<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДМОО «ЧОУ Гимназия №35» — скоро открытие</title>

<!-- Favicon: здание школы (вариант 4) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234fa985'/><path d='M16 50 L16 28 L32 18 L48 28 L48 50 Z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/><rect x='28' y='38' width='8' height='12' fill='white'/><circle cx='32' cy='30' r='3' fill='white'/></svg>">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --mint: #7fc8a9;
    --mint-soft: #a8ddc4;
    --mint-deep: #4fa985;
    --mint-dark: #2f7d5f;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    overflow: hidden;
    position: relative;
    padding: 24px;
    background: linear-gradient(135deg,
      #eafaf1 0%, #d4f0e2 35%, #b9e6d3 65%, #eafaf1 100%);
    background-size: 200% 200%;
    animation: bgShift 18s ease-in-out infinite;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ===== Воздушные пятна ===== */
  .air {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
  }
  .air--1 {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
    top: -140px; left: -120px;
    animation: drift1 22s ease-in-out infinite;
  }
  .air--2 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, var(--mint-soft) 0%, rgba(168,221,196,0) 70%);
    bottom: -180px; right: -140px;
    animation: drift2 26s ease-in-out infinite;
  }
  .air--3 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
    top: 40%; left: 55%;
    opacity: 0.35;
    animation: drift3 30s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(60px,40px) scale(1.12); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-70px,-50px) scale(1.1); }
  }
  @keyframes drift3 {
    0%,100% { transform: translate(0,0) scale(1); opacity: 0.25; }
    50%     { transform: translate(-40px,30px) scale(1.08); opacity: 0.45; }
  }

  /* ===== Слой листьев ===== */
  .leaves {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .leaf {
    position: absolute;
    top: -40px;
    font-size: 22px;
    line-height: 1;
    opacity: 0;
    will-change: transform, opacity;
    animation: leafFall linear infinite;
    filter: drop-shadow(0 2px 3px rgba(47,125,95,0.15));
    user-select: none;
  }

  @keyframes leafFall {
    0% {
      transform: translate3d(0, -40px, 0) rotate(0deg) scale(0.9);
      opacity: 0;
    }
    8%  { opacity: var(--leaf-opacity, 0.75); }
    50% {
      transform: translate3d(var(--sway, 40px), 50vh, 0) rotate(180deg) scale(1);
      opacity: var(--leaf-opacity, 0.75);
    }
    92% { opacity: var(--leaf-opacity, 0.75); }
    100% {
      transform: translate3d(calc(var(--sway, 40px) * -0.6), 110vh, 0) rotate(360deg) scale(0.9);
      opacity: 0;
    }
  }

  /* ===== Слой искр ===== */
  .sparks {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.6) 40%, rgba(255,255,255,0) 70%);
    opacity: 0;
    will-change: transform, opacity;
    animation: sparkle ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.4); }
    50%      { opacity: 0.9; transform: scale(1.1); }
  }

  /* ===== Волна-горизонт ===== */
  .horizon {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 130px;
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
  }

  /* ===== Карточка ===== */
  .cover {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 700px;
    width: 100%;
    padding: 52px 48px 48px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow:
      0 24px 70px rgba(47, 125, 95, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    animation:
      cardIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) both,
      breathe 9s ease-in-out 1.4s infinite;
    will-change: transform, opacity;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes breathe {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }

  /* ===== Логотип ===== */
  .logo {
    width: 104px;
    height: 104px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, #ffffff 0%, rgba(255,255,255,0.6) 40%, rgba(255,255,255,0) 70%),
      linear-gradient(135deg, rgba(127,200,169,0.55), rgba(79,169,133,0.75));
    box-shadow:
      0 14px 34px rgba(79,169,133,0.35),
      inset 0 1px 0 rgba(255,255,255,0.85);
    opacity: 0;
    transform: scale(0.85);
    animation: logoIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards,
               logoFloat 7s ease-in-out 1.8s infinite;
  }

  .logo svg { width: 62%; height: 62%; display: block; }
  .logo svg path, .logo svg circle {
    stroke: #ffffff; fill: none; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .logo svg .fill-soft { fill: rgba(255,255,255,0.9); stroke: none; }

  @keyframes logoIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes logoFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%     { transform: translateY(-5px) rotate(-1.5deg); }
  }

  /* ===== Тексты ===== */
  .subtitle {
    font-size: 1.05rem;
    color: var(--mint-dark);
    letter-spacing: 0.6px;
    font-weight: 400;
    opacity: 0;
    animation: fadeUp 1.2s ease 0.6s forwards;
  }

  .divider {
    width: 72px;
    height: 3px;
    margin: 20px auto 24px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--mint), transparent);
    opacity: 0;
    animation: fadeUp 1.2s ease 0.9s forwards;
  }

  .school-name {
    font-size: clamp(1.4rem, 4.1vw, 2.5rem);
    font-weight: 700;
    color: var(--mint-dark);
    line-height: 1.3;
    margin-bottom: 34px;
    letter-spacing: 0.4px;
  }

  .school-name .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(14px);
    filter: blur(6px);
    animation: letterIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    will-change: transform, opacity, filter;
  }
  .school-name .space { display: inline-block; width: 0.3em; }

  @keyframes letterIn {
    0%   { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Кнопка ===== */
  .btn-vk {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 34px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 1.02rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--mint) 0%, var(--mint-deep) 100%);
    box-shadow:
      0 10px 26px rgba(79,169,133,0.35),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition:
      transform 0.6s cubic-bezier(0.16,1,0.3,1),
      box-shadow 0.6s cubic-bezier(0.16,1,0.3,1),
      background 0.6s ease;
    opacity: 0;
    animation: fadeUp 1.4s ease 2.6s forwards;
    will-change: transform;
  }
  .btn-vk:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow:
      0 16px 36px rgba(79,169,133,0.45),
      inset 0 1px 0 rgba(255,255,255,0.45);
    background: linear-gradient(135deg, var(--mint-deep) 0%, var(--mint-dark) 100%);
  }
  .btn-vk:active { transform: translateY(-1px) scale(1); transition-duration: 0.15s; }
  .btn-vk svg {
    width: 22px; height: 22px; fill: #fff;
    transition: transform 0.6s cubic-bezier(0.16,1,0.3,1);
  }
  .btn-vk:hover svg { transform: rotate(-6deg) scale(1.08); }

  @media (max-width: 480px) {
    .cover { padding: 38px 22px; border-radius: 24px; }
    .logo { width: 84px; height: 84px; margin-bottom: 18px; }
    .btn-vk { padding: 14px 24px; font-size: 0.95rem; }
    .school-name { margin-bottom: 28px; }
    .leaf { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .leaf, .spark { display: none; }
  }
</style>
</head>
<body>

  <!-- Воздушные пятна -->
  <div class="air air--1"></div>
  <div class="air air--2"></div>
  <div class="air air--3"></div>

  <!-- Падающие листья -->
  <div class="leaves" id="leaves"></div>

  <!-- Мерцающие искры -->
  <div class="sparks" id="sparks"></div>

  <!-- Волна-горизонт -->
  <svg class="horizon" viewBox="0 0 1440 130" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,64 C240,100 480,20 720,48 C960,76 1200,110 1440,60 L1440,130 L0,130 Z"
          fill="#a8ddc4" opacity="0.6"/>
    <path d="M0,86 C240,116 480,56 720,76 C960,96 1200,126 1440,86 L1440,130 L0,130 Z"
          fill="#7fc8a9" opacity="0.45"/>
  </svg>

  <div class="cover">
    <!-- Логотип -->
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 44 L8 20 Q18 16 32 22 Q46 16 56 20 L56 44 Q46 40 32 46 Q18 40 8 44 Z"/>
        <path d="M32 22 L32 46"/>
        <path d="M32 20 Q32 12 26 10 Q28 16 32 20 Z"/>
        <path d="M32 20 Q32 12 38 10 Q36 16 32 20 Z"/>
        <circle cx="32" cy="7" r="1.8" class="fill-soft"/>
      </svg>
    </div>

    <p class="subtitle">Здесь скоро появится официальный сайт школы</p>
    <div class="divider"></div>
    <h1 class="school-name" id="schoolName">ДМОО «ЧОУ Гимназия №35»</h1>

    <a class="btn-vk" href="https://vk.ru/ruzavinevgeniy" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.162 18.994c.609 0 .858-.406.851-.915-.031-1.917.714-2.949 2.059-1.604 1.488 1.488 1.796 2.519 3.603 2.519h3.2c.808 0 1.126-.26 1.126-.668 0-.863-1.421-2.386-2.625-3.504-1.686-1.565-1.765-1.602-.313-3.486 1.801-2.339 4.157-5.336 2.073-5.336h-3.981c-.772 0-.828.435-1.103 1.083-.995 2.347-2.886 5.387-3.604 4.922-.751-.485-.407-2.406-.35-5.261.015-.754.011-1.271-1.141-1.539-.629-.145-1.241-.205-1.809-.205-2.273 0-3.841.953-2.95 1.119 1.571.293 1.42 3.692 1.054 5.16-.638 2.556-3.036-2.024-4.035-4.305-.241-.548-.315-.974-1.175-.974h-3.255c-.492 0-.787.16-.787.516 0 .602 2.96 6.72 5.786 9.77 2.756 2.975 5.575 2.389 7.494 2.389z"/>
      </svg>
      Написать директору в ВК
    </a>
  </div>

<script>
  /* === Анимация букв === */
  const el = document.getElementById('schoolName');
  const text = el.textContent;
  el.textContent = '';
  [...text].forEach((char, i) => {
    const span = document.createElement('span');
    if (char === ' ') {
      span.className = 'space';
      span.textContent = '\u00A0';
    } else {
      span.className = 'letter';
      span.textContent = char;
      span.style.animationDelay = (1.0 + i * 0.04) + 's';
    }
    el.appendChild(span);
  });

  /* === Генерация листьев === */
  (function generateLeaves() {
    const layer = document.getElementById('leaves');
    const LEAVES = ['🍃', '🌿', '🍂', '🍁'];
    const COUNT = window.innerWidth < 600 ? 14 : 24;

    for (let i = 0; i < COUNT; i++) {
      const leaf = document.createElement('span');
      leaf.className = 'leaf';
      leaf.textContent = LEAVES[Math.floor(Math.random() * LEAVES.length)];

      const size    = 16 + Math.random() * 18;       // 16–34px
      const left    = Math.random() * 100;           // %
      const dur     = 10 + Math.random() * 14;       // 10–24 с
      const delay   = -Math.random() * dur;          // старт в середине
      const sway    = -60 + Math.random() * 120;     // снос влево/вправо
      const opacity = 0.45 + Math.random() * 0.35;

      leaf.style.left = left + '%';
      leaf.style.fontSize = size + 'px';
      leaf.style.animationDuration = dur + 's';
      leaf.style.animationDelay = delay + 's';
      leaf.style.setProperty('--sway', sway + 'px');
      leaf.style.setProperty('--leaf-opacity', opacity);

      layer.appendChild(leaf);
    }
  })();

  /* === Генерация искр === */
  (function generateSparks() {
    const layer = document.getElementById('sparks');
    const COUNT = window.innerWidth < 600 ? 12 : 22;

    for (let i = 0; i < COUNT; i++) {
      const s = document.createElement('span');
      s.className = 'spark';

      const size  = 3 + Math.random() * 5;            // 3–8px
      const left  = Math.random() * 100;
      const top   = Math.random() * 100;
      const dur   = 3 + Math.random() * 5;            // 3–8 с
      const delay = Math.random() * dur;

      s.style.left = left + '%';
      s.style.top  = top + '%';
      s.style.width  = size + 'px';
      s.style.height = size + 'px';
      s.style.animationDuration = dur + 's';
      s.style.animationDelay    = delay + 's';

      layer.appendChild(s);
    }
  })();
</script>
</body>
</html>
